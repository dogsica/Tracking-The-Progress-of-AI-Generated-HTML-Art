<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple HTML Turtle</title>
  <style>
    /* Centers the turtle on the screen */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #e0f7fa; /* Light blue water background */
      margin: 0;
    }

    /* The main container for our turtle parts */
    .turtle {
      position: relative;
      width: 200px;
      height: 250px;
    }

    /* The Shell */
    .shell {
      position: absolute;
      top: 50px;
      left: 25px;
      width: 150px;
      height: 180px;
      background-color: #2e7d32;
      border-radius: 50% 50% 45% 45%;
      border: 4px solid #1b5e20;
      z-index: 2; /* Keeps the shell on top of the legs */
      box-shadow: inset -10px -10px 20px rgba(0,0,0,0.3); /* Adds a little 3D shading */
    }

    /* The Head */
    .head {
      position: absolute;
      top: 10px;
      left: 70px;
      width: 60px;
      height: 70px;
      background-color: #81c784;
      border-radius: 50%;
      border: 3px solid #388e3c;
      z-index: 1;
    }

    /* The Eyes */
    .eye {
      position: absolute;
      width: 8px;
      height: 8px;
      background-color: black;
      border-radius: 50%;
      top: 20px;
    }
    .eye.left { left: 15px; }
    .eye.right { right: 15px; }

    /* The Legs */
    .leg {
      position: absolute;
      width: 40px;
      height: 60px;
      background-color: #81c784;
      border-radius: 30px;
      border: 3px solid #388e3c;
      z-index: 1; /* Puts the legs under the shell */
    }
    .leg.front-left {
      top: 50px;
      left: 5px;
      transform: rotate(-45deg);
    }
    .leg.front-right {
      top: 50px;
      right: 5px;
      transform: rotate(45deg);
    }
    .leg.back-left {
      bottom: 10px;
      left: 20px;
      transform: rotate(-30deg);
    }
    .leg.back-right {
      bottom: 10px;
      right: 20px;
      transform: rotate(30deg);
    }

    /* The Tail */
    .tail {
      position: absolute;
      bottom: -5px;
      left: 90px;
      width: 20px;
      height: 40px;
      background-color: #81c784;
      border-radius: 50%;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="turtle">
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
    </div>
    
    <div class="leg front-left"></div>
    <div class="leg front-right"></div>
    
    <div class="shell"></div>
    
    <div class="leg back-left"></div>
    <div class="leg back-right"></div>
    
    <div class="tail"></div>
  </div>

</body>
</html>

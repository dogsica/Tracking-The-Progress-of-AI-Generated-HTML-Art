<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyper-Realistic CSS Turtle</title>
  <style>
    :root {
      --skin-color: #6d7c4a;
      --skin-highlight: #a2b078;
      --shell-main: #3e4a20;
      --shell-dark: #1b220a;
      --accent: #d1cdae;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #222; /* Dark background to make the lighting pop */
      margin: 0;
      overflow: hidden;
    }

    /* SVG Filter for "Leathery" texture */
    .textured {
      filter: url(#leathery);
    }

    .turtle-container {
      position: relative;
      width: 350px;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: breathe 4s ease-in-out infinite;
    }

    /* Ambient Shadow */
    .shadow {
      position: absolute;
      bottom: 40px;
      width: 280px;
      height: 100px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      filter: blur(20px);
      z-index: 0;
    }

    /* --- THE SHELL --- */
    .shell {
      position: relative;
      width: 220px;
      height: 260px;
      background: radial-gradient(circle at 30% 30%, var(--shell-main), var(--shell-dark));
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      box-shadow: 
        inset -20px -20px 40px rgba(0,0,0,0.8),
        inset 10px 10px 30px rgba(255,255,255,0.1),
        0 15px 30px rgba(0,0,0,0.5);
      z-index: 10;
      overflow: hidden;
      border: 2px solid #000;
    }

    /* Scute Pattern */
    .shell::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.3;
      background-image: 
        radial-gradient(circle at 50% 50%, transparent 60%, #000 62%),
        repeating-conic-gradient(from 0deg, transparent 0deg 60deg, rgba(0,0,0,0.2) 61deg 120deg);
      background-size: 60px 60px;
    }

    /* --- THE HEAD & NECK --- */
    .neck-container {
      position: absolute;
      top: 10px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .head {
      width: 65px;
      height: 90px;
      background: radial-gradient(circle at 30% 20%, var(--skin-highlight), var(--skin-color));
      border-radius: 50% 50% 45% 45% / 70% 70% 30% 30%;
      position: relative;
      box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
      animation: look-around 8s ease-in-out infinite;
    }

    .eye {
      position: absolute;
      top: 30px;
      width: 14px;
      height: 14px;
      background: #111;
      border-radius: 50%;
      border: 2px solid #222;
      overflow: hidden;
    }

    /* Blinking Animation */
    .eye::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--skin-color);
      top: -100%;
      animation: blink 5s infinite;
    }

    /* Eye Glint */
    .eye::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
    }

    .eye.left { left: 8px; }
    .eye.right { right: 8px; }

    /* --- LIMBS --- */
    .flipper {
      position: absolute;
      background: radial-gradient(circle at center, var(--skin-highlight), var(--skin-color));
      z-index: 1;
    }

    .front-left {
      width: 90px;
      height: 120px;
      top: 40px;
      left: -40px;
      clip-path: polygon(100% 20%, 0% 50%, 20% 100%, 100% 80%);
      transform: rotate(-10deg);
    }

    .front-right {
      width: 90px;
      height: 120px;
      top: 40px;
      right: -40px;
      clip-path: polygon(0% 20%, 100% 50%, 80% 100%, 0% 80%);
      transform: rotate(10deg);
    }

    /* Claws */
    .claws {
      position: absolute;
      bottom: 5px;
      display: flex;
      gap: 4px;
      left: 10%;
    }

    .claw {
      width: 6px;
      height: 12px;
      background: var(--accent);
      border-radius: 50% 50% 20% 20%;
      box-shadow: inset 0 -2px 2px rgba(0,0,0,0.3);
    }

    /* --- ANIMATIONS --- */
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes blink {
      0%, 90%, 100% { top: -100%; }
      95% { top: 0%; }
    }

    @keyframes look-around {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg) translateX(-2px); }
      75% { transform: rotate(5deg) translateX(2px); }
    }
  </style>
</head>
<body>

  <svg style="position: absolute; width: 0; height: 0;">
    <filter id="leathery">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="1">
        <feDistantLight azimuth="45" elevation="60" />
      </feDiffuseLighting>
      <feComposite operator="in" in2="SourceGraphic" />
      <feBlend in="SourceGraphic" mode="multiply" />
    </filter>
  </svg>

  <div class="turtle-container">
    <div class="shadow"></div>

    <div class="neck-container">
      <div class="head textured">
        <div class="eye left"></div>
        <div class="eye right"></div>
      </div>
    </div>

    <div class="flipper front-left textured">
      <div class="claws">
        <div class="claw"></div>
        <div class="claw"></div>
        <div class="claw"></div>
      </div>
    </div>
    <div class="flipper front-right textured">
      <div class="claws">
        <div class="claw"></div>
        <div class="claw"></div>
        <div class="claw"></div>
      </div>
    </div>

    <div class="shell"></div>

    <div class="flipper textured" style="width: 70px; height: 90px; bottom: 40px; left: 30px; border-radius: 40%; z-index: 0; opacity: 0.8;"></div>
    <div class="flipper textured" style="width: 70px; height: 90px; bottom: 40px; right: 30px; border-radius: 40%; z-index: 0; opacity: 0.8;"></div>

  </div>

</body>
</html>
